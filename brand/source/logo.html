<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:transparent;overflow:hidden}svg{display:block}</style>
<script src="brand.js"></script><script src="glyphs.js"></script><script src="diecut.js" onerror="window.DIECUT=null"></script></head><body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024"></svg>
<script>
// Primary logo: die-cut sticker. The dev bursts out of a gold starburst and grips the AMONG/RUGS sign.
// Hash: (none) transparent final | #bg=07090d solid background | #mask die-cut silhouette for trace_diecut.py
(async () => {
  await B.fontsReady();
  const INK = B.INK;
  const H = location.hash.slice(1);
  const MASK = H === 'mask';
  const BG = H.startsWith('bg=') ? '#' + H.slice(3) : null;
  const o = [];
  o.push(`<defs>${B.defs()}${B.glowDef('wm-glow', 20)}
<pattern id="ht-gold" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><circle cx="8" cy="8" r="4" fill="#ff9f1c"/></pattern>
<pattern id="ht-plate" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><circle cx="8" cy="8" r="3" fill="#161e2b"/></pattern>
<radialGradient id="fadeG" cx="50%" cy="50%" r="50%"><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></radialGradient>
<mask id="gmask"><rect width="1024" height="1024" fill="url(#fadeG)"/></mask>
<linearGradient id="plateFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>
<mask id="pmask"><rect x="0" y="560" width="1024" height="400" fill="url(#plateFade)"/></mask>
<filter id="sil" x="-20%" y="-20%" width="140%" height="140%">
  <feMorphology in="SourceAlpha" operator="dilate" radius="17" result="d"/>
  <feGaussianBlur in="d" stdDeviation="15" result="b"/>
  <feComponentTransfer in="b" result="smooth"><feFuncA type="linear" slope="30" intercept="-14"/></feComponentTransfer>
  <feFlood flood-color="#ffffff"/><feComposite in2="smooth" operator="in"/>
</filter>
</defs>`);
  if (BG) o.push(`<rect width="1024" height="1024" fill="${BG}"/>`);

  const BC = [512, 330];
  const burstPts = B.burst(BC[0], BC[1], 300, 238, 16, 11, 0, 0.55);
  const plate = 'M150 590Q148 566 172 564L852 552Q876 552 878 576L884 906Q886 930 862 932L176 944Q152 944 150 920Z';

  const art = [];
  art.push(`<polygon points="${burstPts}" fill="#ffd400" stroke="${INK}" stroke-width="12" stroke-linejoin="round"/>`);
  art.push(`<g mask="url(#gmask)"><polygon points="${burstPts}" fill="url(#ht-gold)"/></g>`);
  // the dev, standing behind the sign
  const S = 6.3;
  art.push(`<g transform="translate(${512 + 14} ${338 + 10}) scale(${S})"><path d="M-18-14A18 18 0 0 1 18-14V14A18 18 0 0 1-18 14Z" fill="${INK}"/></g>`);
  art.push(B.dev({ x: 512, y: 338, s: S, sw: 2.1, legs: false }));
  // the sign
  art.push(`<path d="${plate}" fill="#07090d" stroke="${INK}" stroke-width="12" stroke-linejoin="round"/>`);
  art.push(`<path d="${plate}" fill="url(#ht-plate)" mask="url(#pmask)"/>`);
  art.push(`<path d="M182 588L846 577" stroke="#2a3444" stroke-width="5" stroke-linecap="round"/>`);
  // mitten hands over the sign edge
  const hand = (x, y, r) => `<g transform="translate(${x} ${y}) rotate(${r})"><rect x="-44" y="-34" width="88" height="62" rx="28" fill="#f2f5f8" stroke="${INK}" stroke-width="10"/><path d="M-15 6V26M0 8V27M15 6V26" stroke="${INK}" stroke-width="7" stroke-linecap="round"/><ellipse cx="-20" cy="-16" rx="10" ry="5" fill="#fff" opacity=".9"/></g>`;
  art.push(hand(390, 570, -4), hand(634, 566, 4));
  // wordmark: same treatment as banner / OG (white AMONG + slate extrusion, red RUGS + oxblood extrusion + glow)
  art.push(B.wordmark({ x: 506, y: 718, size: 150, anchor: 'middle', sticker: false }));
  // the -99% sticker slapped on the sign's corner
  art.push(B.sticker({ x: 846, y: 912, s: 1.42, rot: -10 }));
  const ART = art.join('');
  const FRAME = (inner) => `<g transform="translate(512 512) scale(.93) translate(-512 -508)">${inner}</g>`;

  if (MASK) {
    // silhouette (+ a disc that fills the burst's valleys) -> dilate/blur/threshold -> white blob, traced by trace_diecut.py
    o.push(`<g filter="url(#sil)">${FRAME(`<circle cx="${BC[0]}" cy="${BC[1]}" r="252" fill="#000"/>${ART}`)}</g>`);
  } else {
    if (window.DIECUT) {
      o.push(`<path d="${window.DIECUT}" fill="#ffffff" stroke="${INK}" stroke-width="15" stroke-linejoin="round" paint-order="stroke"/>`);
    }
    o.push(FRAME(ART));
  }
  const svg = document.getElementById('s');
  svg.innerHTML = o.join('');
  if (!MASK) { B.outlineTexts(svg); B.flattenPaintOrder(svg); } // Bungee -> paths + no paint-order: PNG and SVG identical, font-free
  window.exportSVG = () => {
    const c = svg.cloneNode(true);
    c.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    c.removeAttribute('id');
    c.setAttribute('role', 'img'); c.setAttribute('aria-label', 'AMONG RUGS');
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'title'); t.textContent = 'AMONG RUGS'; c.insertBefore(t, c.firstChild);
    return `<?xml version="1.0" encoding="UTF-8"?>\n<!-- AMONG RUGS logo. Lettering is Bungee (SIL Open Font License 1.1) converted to outlines; no fonts required. -->\n` + c.outerHTML;
  };
  window.READY = true;
})();
</script></body></html>
