<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:transparent;overflow:hidden}svg{display:block}</style>
<script src="brand.js"></script></head><body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400"></svg>
<script>
// X profile picture, 400x400 (opaque). The dev on a gold burst with the -99% sticker.
// #art renders only the key art (no background / burst) on transparent, for the circle-safe radius check.
(async () => {
  await B.fontsReady();
  const HS = location.hash.slice(1).split(',');
  const ART_ONLY = HS.includes('art'); // key art only (no bg / burst), for the safe-radius check
  const INK = B.INK;
  const C = [200, 203]; // burst center
  const o = [];
  o.push(`<defs>${B.defs()}
<pattern id="ht-gold" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><circle cx="4.5" cy="4.5" r="2.3" fill="#ff9f1c"/></pattern>
<pattern id="ht-bg" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><circle cx="6" cy="6" r="2.2" fill="#1b2433"/></pattern>
<radialGradient id="fadeIn" cx="50%" cy="50%" r="50%"><stop offset="0.35" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></radialGradient>
<mask id="htmask"><rect width="400" height="400" fill="url(#fadeIn)"/></mask>
<radialGradient id="fadeG" cx="50%" cy="50%" r="50%"><stop offset="0.5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></radialGradient>
<mask id="gmask"><rect width="400" height="400" fill="url(#fadeG)"/></mask>
</defs>`);
  // background + rays
  if (!ART_ONLY) {
  o.push(`<rect width="400" height="400" fill="#07090d"/>`);
  let rays = '';
  for (let i = 0; i < 24; i++) {
    const a0 = (i / 24) * Math.PI * 2, a1 = a0 + Math.PI / 24;
    rays += `<path d="M${C[0]} ${C[1]}L${C[0] + Math.cos(a0) * 400} ${C[1] + Math.sin(a0) * 400}L${C[0] + Math.cos(a1) * 400} ${C[1] + Math.sin(a1) * 400}Z" fill="#131a27"/>`;
  }
  o.push(rays);
  o.push(`<rect width="400" height="400" fill="url(#ht-bg)" mask="url(#htmask)"/>`);
  // gold burst
  const bp = B.burst(C[0], C[1], 180, 140, 15, 7);
  o.push(`<polygon points="${bp}" fill="#ffd400" stroke="${INK}" stroke-width="7" stroke-linejoin="round"/>`);
  o.push(`<g mask="url(#gmask)"><polygon points="${bp}" fill="url(#ht-gold)"/></g>`);
  }

  const S = 4.5, PX = 198, PY = 186, TILT = -7;
  o.push(`<g transform="rotate(${TILT} ${PX} ${PY + 20})">`);
  // comic offset shadow behind the body
  o.push(`<g transform="translate(${PX + 10} ${PY + 9}) scale(${S})"><path d="M-18-14A18 18 0 0 1 18-14V14A18 18 0 0 1-18 14Z" fill="${INK}" opacity=".92"/></g>`);
  o.push(B.dev({ x: PX, y: PY, s: S, sw: 2.2, legs: true }));
  o.push(`</g>`);
  // the -99% sticker slapped on the belly
  o.push(B.sticker({ x: 250, y: 289, s: 1.1, rot: -10 }));
  document.getElementById('s').innerHTML = o.join('');
  window.READY = true;
})();
</script></body></html>
